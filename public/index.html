<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>RTY FPS 4.0</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/hud.css">
</head>

<body>

<!-- شاشة التحميل -->
<div id="loadingScreen" class="screen">
    <div class="loading-box">
        <h1>RTY FPS</h1>
        <p>Loading assets...</p>
        <div class="progress-bar">
            <div id="progress"></div>
        </div>
    </div>
</div>

<!-- القائمة الرئيسية -->
<div id="mainMenu" class="screen">

    <div class="menu-card">

        <h1 class="game-title">RTY FPS</h1>

        <p class="subtitle">Ultimate Edition 4.0</p>

        <label>Player Name</label>
        <input id="playerName"
               type="text"
               maxlength="16"
               value="Player"
               placeholder="Enter your name">

        <label>Choose Map</label>
        <select id="mapSelect">
            <option value="desert">Desert</option>
            <option value="city">City</option>
            <option value="factory">Factory</option>
            <option value="snow">Snow</option>
        </select>

        <label>Primary Weapon</label>
        <select id="weaponSelect">
            <option value="ak47">AK-47</option>
            <option value="m4">M4A1</option>
            <option value="sniper">Sniper</option>
            <option value="shotgun">Shotgun</option>
            <option value="pistol">Pistol</option>
        </select>

        <div class="menu-buttons">

            <button id="playButton" class="btn btn-play">
                ▶ PLAY
            </button>

            <button id="settingsButton" class="btn">
                ⚙ SETTINGS
            </button>

            <button id="leaderboardButton" class="btn">
                🏆 LEADERBOARD
            </button>

            <button id="helpButton" class="btn">
                ❓ HOW TO PLAY
            </button>

        </div>

    </div>

</div>

<!-- نافذة الإعدادات -->
<div id="settingsPanel" class="popup hidden">

    <div class="popup-card">

        <h2>Settings</h2>

        <label>Mouse Sensitivity</label>
        <input id="sensitivity"
               type="range"
               min="0.001"
               max="0.01"
               step="0.001"
               value="0.002">

        <label>Master Volume</label>
        <input id="volume"
               type="range"
               min="0"
               max="1"
               step="0.05"
               value="0.8">

        <label>Graphics Quality</label>
        <select id="graphics">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="ultra">Ultra</option>
        </select>

        <button id="closeSettings" class="btn">
            Close
        </button>

    </div>

</div>

<!-- لوحة المتصدرين -->
<div id="leaderboardPanel" class="popup hidden">

    <div class="popup-card">

        <h2>Leaderboard</h2>

        <div id="leaderboardList">

            <p>No data yet</p>

        </div>

        <button id="closeLeaderboard" class="btn">
            Close
        </button>

    </div>

</div>

<!-- واجهة اللعب -->
<div id="hud" class="hidden">

    <div id="topLeft" class="hud-box">

        ❤️ HP:
        <span id="health">100</span>

        <br>

        🛡️ Armor:
        <span id="armor">0</span>

    </div>

    <div id="topRight" class="hud-box">

        🎯 Kills:
        <span id="kills">0</span>

        <br>

        ⭐ Score:
        <span id="score">0</span>

    </div>

    <div id="bottomRight" class="hud-box">

        🔫
        <span id="weaponName">AK-47</span>

        <br>

        <span id="ammo">30</span>
        /
        <span id="reserveAmmo">120</span>

    </div>

    <div id="crosshair">+</div>

    <div id="killFeed"></div>

</div>

<!-- شاشة الموت -->
<div id="deathScreen" class="screen hidden">

    <div class="popup-card">

        <h1>YOU DIED</h1>

        <p id="deathReason">Killed by Enemy</p>

        <button id="respawnButton" class="btn btn-play">
            RESPAWN
        </button>

    </div>

</div>

<!-- Canvas اللعبة -->
<canvas id="gameCanvas"></canvas>

<!-- ملفات JavaScript -->
<script type="module" src="js/main.js"></script>

</body>
</html>
