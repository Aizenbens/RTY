<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRUNK-WAR 3D - Ultimate Pro Edition</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; user-select: none; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #mainMenu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; color: #fff;
        }
        .menu-card {
            background: rgba(30, 41, 59, 0.95); padding: 24px; border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85); width: 90%; max-width: 450px; text-align: center; border: 2px solid #64748b;
        }
        h1 { margin: 0 0 10px 0; font-size: 28px; color: #38bdf8; font-weight: 900; text-shadow: 2px 2px 4px #000; }
        label { font-size: 12px; color: #94a3b8; display: block; text-align: right; margin-top: 10px; font-weight: bold; }
        select, input, input[type=range] { width: 100%; padding: 10px; margin: 4px 0; border-radius: 6px; border: none; font-size: 13px; font-weight: bold; background: #0f172a; color: #fff; text-align: center; border: 2px solid #334155; }
        
        .btn-main { width: 100%; padding: 14px; background: #10b981; color: #0f172a; cursor: pointer; border-radius: 8px; border: none; font-size: 16px; font-weight: 900; margin-top: 16px; }

        #gameWrapper { display: none; position: relative; width: 100vw; height: 100vh; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; transform: translate(-50%, -50%); pointer-events: none; z-index: 6; background: #10b981; border-radius: 50%; border: 1px solid #000; }
        
        #damageVignette {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 12; opacity: 0; transition: opacity 0.15s ease-out;
            box-shadow: inset 0 0 100px 40px rgba(239, 68, 68, 0.8);
        }

        #timerUI {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); border: 2px solid #f59e0b; padding: 6px 18px;
            border-radius: 20px; color: #f59e0b; font-size: 18px; font-weight: 900; z-index: 5;
            letter-spacing: 1px; box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        #notifications { position: absolute; top: 60px; right: 12px; z-index: 10; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
        .toast { background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; }

        #scopeOverlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9; display: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.98) 35%, #000 100%);
        }
        #scopeOverlay::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(0,0,0,0.8); }
        #scopeOverlay::before { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: rgba(0,0,0,0.8); }

        #healthUI { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85); padding: 8px 12px; border-radius: 8px; border: 2px solid #475569; color: #fff; font-size: 11px; z-index: 4; width: 160px; }
        .hp-bar-container { width: 100%; background: #334155; height: 10px; border-radius: 5px; margin-top: 4px; overflow: hidden; }
        #hpBarFill { width: 100%; background: #10b981; height: 100%; transition: width 0.2s; }

        #leaderboard {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 360px; background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8;
            border-radius: 12px; padding: 16px; color: #fff; z-index: 25; display: none;
        }
        #leaderboard h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; color: #38bdf8; }
        .lb-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #334155; font-size: 13px; }

        #weaponUI { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); padding: 6px 10px; border-radius: 8px; border: 2px solid #475569; color: #fff; font-size: 11px; z-index: 4; text-align: center; }
        .weapon-slots { display: flex; gap: 4px; margin-top: 4px; }
        .slot { padding: 4px 8px; background: #1e293b; border: 2px solid #334155; border-radius: 4px; font-size: 10px; color: #fff; cursor: pointer; font-weight: bold; }
        .slot.active { border-color: #38bdf8; background: #0284c7; color: #fff; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="mainMenu">
    <div class="menu-card">
        <h1>KRUNK-WAR 3D</h1>
        <label>اسم اللاعب:</label>
        <input type="text" id="playerNameInput" value="Robloxian_1">

        <label>حساسية الماوس:</label>
        <input type="range" id="sensInput" min="0.001" max="0.008" step="0.0005" value="0.0022">

        <label>رمز الغرفة (للانضمام لنفس الجولة):</label>
        <input type="text" id="roomCodeInput" value="krunk123">

        <button class="btn-main" onclick="start3DGame()">انضمام للمعركة 🚀</button>
    </div>
</div>

<div id="notifications"></div>
<div id="damageVignette"></div>

<div id="gameWrapper">
    <div id="crosshair"></div>
    <div id="scopeOverlay"></div>
    <div id="timerUI">04:00</div>

    <div id="leaderboard">
        <h2>🏆 جدول النتائج (Leaderboard)</h2>
        <div id="lbContent"></div>
    </div>

    <div id="healthUI">
        <div>الصحة (HP): <span id="hpValue">100</span></div>
        <div class="hp-bar-container"><div id="hpBarFill"></div></div>
        <div style="margin-top: 4px; display: flex; justify-content: space-between;">
            <span>الذخيرة:</span>
            <span id="ammoCount">10 / 50</span>
        </div>
    </div>

    <div id="weaponUI">
        <div id="currentWeaponText">بندقية قنص 🎯</div>
        <div class="weapon-slots">
            <div class="slot" id="slot1" onclick="selectWeapon(1)">1: سكين</div>
            <div class="slot" id="slot2" onclick="selectWeapon(2)">2: مسدس</div>
            <div class="slot active" id="slot3" onclick="selectWeapon(3)">3: قناصة</div>
        </div>
    </div>
</div>

<script>
    let scene, camera, renderer;
    let myPos = { x: 2500, y: 35, z: 2500 };
    let playerYaw = 0, playerPitch = 0;
    let playerName = "لاعب";
    let mouseSensitivity = 0.0022;
    let isThirdPerson = false;
    let thirdPersonMesh;

    let hp = 100;
    let kills = 0, deaths = 0;
    let peer, peerId;
    let otherPlayers = {};
    let connections = [];

    const keys = { w: false, a: false, s: false, d: false, shift: false, slide: false };
    let isGrounded = true, velocityY = 0;
    const gravity = -0.38, jumpPower = 6.2;
    let baseMoveSpeed = 3.2;

    // حالة التزحلق (Slide)
    let isSliding = false;
    let slideTimer = 0;

    let roundTimeSeconds = 240;
    let zoneRadius = 2400;
    let zoneCenter = { x: 2500, z: 2500 };
    let zoneMesh;

    let fpWeaponGroup, muzzleFlashLight;
    let knifeMesh, pistolMesh, rifleMesh;
    let isKnifeSwinging = false, knifeAttackType = 0, knifeAnimTime = 0;
    let isReloading = false, reloadAnimTime = 0;

    let obstacleBoxes = []; // مصفوفة فحص الاصطدامات الحقيقية
    let isAiming = false;

    const WEAPONS = {
        1: { name: "سكين تكتيكي 🗡️", cd: 200, damage: 100, isMelee: true },
        2: { name: "مسدس فاخر 🔫", cd: 180, damage: 40, maxAmmo: 12, currentAmmo: 12, reserveAmmo: 60 },
        3: { name: "بندقية قنص 🎯", cd: 400, damage: 90, maxAmmo: 10, currentAmmo: 10, reserveAmmo: 50 }
    };
    let currentWeaponId = 3;

    function showNotification(msg) {
        const notifContainer = document.getElementById('notifications');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        notifContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function start3DGame() {
        playerName = document.getElementById('playerNameInput').value || "Robloxian_1";
        mouseSensitivity = parseFloat(document.getElementById('sensInput').value);

        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('gameWrapper').style.display = 'block';

        init3D();
        initMultiplayer();

        setInterval(() => {
            if (zoneRadius > 400) {
                zoneRadius -= 350;
                showNotification("⚠️ الجدار المتقلص يصغر الآن!");
                updateZoneMesh();
            }
        }, 45000);

        setInterval(() => {
            roundTimeSeconds--;
            let mins = Math.floor(roundTimeSeconds / 60);
            let secs = roundTimeSeconds % 60;
            document.getElementById('timerUI').innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (roundTimeSeconds <= 0) endGame();
        }, 1000);
    }

    function initMultiplayer() {
        let roomCode = document.getElementById('roomCodeInput').value || "krunk123";
        peer = new Peer(roomCode + "_" + Math.floor(Math.random() * 8999 + 1000));

        peer.on('open', (id) => {
            peerId = id;
            showNotification(`انضميت كـ: ${playerName}`);
        });

        peer.on('connection', (conn) => {
            connections.push(conn);
            conn.on('data', (data) => handleNetworkData(data, conn.peer));
        });
    }

    function handleNetworkData(data, senderId) {
        if (data.type === 'update') {
            if (!otherPlayers[senderId]) createOtherPlayer(senderId, data.name, data.pos);
            otherPlayers[senderId].mesh.position.set(data.pos.x, data.pos.y - 15, data.pos.z);
            otherPlayers[senderId].mesh.rotation.y = data.yaw;
        }
    }

    // بناء شخصية روبلوكس كاملة بالأذرع والأقدام
    function createRobloxCharacter() {
        let group = new THREE.Group();

        // الجذع (Torso)
        let torso = new THREE.Mesh(new THREE.BoxGeometry(14, 18, 8), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
        torso.position.y = 15;
        group.add(torso);

        // الرأس (Head)
        let head = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
        head.position.y = 29;
        group.add(head);

        // الذراع الأيسر والأيمن
        let lArm = new THREE.Mesh(new THREE.BoxGeometry(5, 16, 5), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
        lArm.position.set(-10, 15, 0);
        group.add(lArm);

        let rArm = new THREE.Mesh(new THREE.BoxGeometry(5, 16, 5), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
        rArm.position.set(10, 15, 0);
        group.add(rArm);

        // القدم اليسرى واليمنى
        let lLeg = new THREE.Mesh(new THREE.BoxGeometry(6, 14, 6), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
        lLeg.position.set(-4, 7, 0);
        group.add(lLeg);

        let rLeg = new THREE.Mesh(new THREE.BoxGeometry(6, 14, 6), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
        rLeg.position.set(4, 7, 0);
        group.add(rLeg);

        return group;
    }

    function createOtherPlayer(id, name, pos) {
        let group = createRobloxCharacter();

        let canvas = document.createElement('canvas');
        let ctx = canvas.getContext('2d');
        canvas.width = 256; canvas.height = 64;
        ctx.fillStyle = '#ffffff'; ctx.font = 'Bold 28px Arial'; ctx.textAlign = 'center';
        ctx.fillText(name, 128, 40);
        let texture = new THREE.CanvasTexture(canvas);
        let sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
        sprite.position.set(0, 38, 0);
        sprite.scale.set(30, 8, 1);
        group.add(sprite);

        group.position.set(pos.x, pos.y, pos.z);
        scene.add(group);
        otherPlayers[id] = { mesh: group, name: name, kills: 0, deaths: 0 };
    }

    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color('#38bdf8');
        scene.fog = new THREE.FogExp2('#93c5fd', 0.00015);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
        camera.rotation.order = 'YXZ';

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('gameWrapper').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        dirLight.position.set(1500, 2500, 1500);
        scene.add(dirLight);

        buildRandomHousesAndObstacles();

        // جدار الحدود الأحمر الواضح
        updateZoneMesh();

        thirdPersonMesh = createRobloxCharacter();
        scene.add(thirdPersonMesh);

        fpWeaponGroup = new THREE.Group();
        camera.add(fpWeaponGroup);
        scene.add(camera);

        buildWeapons();

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
            if (e.code === 'KeyC' || e.code === 'ControlLeft') {
                if (keys.shift && !isSliding) {
                    isSliding = true;
                    slideTimer = 0;
                }
            }
            if (e.code === 'KeyV') togglePerspective();
            if (e.code === 'Tab') { e.preventDefault(); toggleLeaderboard(true); }
            if (e.code === 'Space' && isGrounded) { velocityY = jumpPower; isGrounded = false; }
            if (e.code === 'KeyR') triggerReload();
            if (e.code === 'Digit1') selectWeapon(1);
            if (e.code === 'Digit2') selectWeapon(2);
            if (e.code === 'Digit3') selectWeapon(3);
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
            if (e.code === 'Tab') toggleLeaderboard(false);
        });

        window.addEventListener('click', () => document.body.requestPointerLock());
        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                playerYaw -= e.movementX * mouseSensitivity;
                playerPitch -= e.movementY * mouseSensitivity;
                playerPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, playerPitch));
            }
        });
        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement === document.body) {
                if (e.button === 0) performAttack();
                if (e.button === 2) toggleADS(true);
            }
        });
        window.addEventListener('mouseup', (e) => { if (e.button === 2) toggleADS(false); });
        window.addEventListener('contextmenu', e => e.preventDefault());

        selectWeapon(3);
        animate();
    }

    function updateZoneMesh() {
        if (zoneMesh) scene.remove(zoneMesh);
        const zoneGeo = new THREE.CylinderGeometry(zoneRadius, zoneRadius, 400, 64, 1, true);
        const zoneMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: false, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
        zoneMesh.position.set(zoneCenter.x, 200, zoneCenter.z);
        scene.add(zoneMesh);
    }

    function buildRandomHousesAndObstacles() {
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshLambertMaterial({ color: 0x15803d }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(2500, 0, 2500);
        scene.add(floor);

        // البيوت والعوائق
        for (let i = 0; i < 12; i++) {
            let hx = 600 + Math.random() * 3800;
            let hz = 600 + Math.random() * 3800;
            let w = 240, d = 220, h = 100;

            let houseGroup = new THREE.Group();
            let houseMat = new THREE.MeshLambertMaterial({ color: 0xe2e8f0 });

            // الجدران
            let wall1 = new THREE.Mesh(new THREE.BoxGeometry(w, h, 10), houseMat);
            wall1.position.set(0, h/2, -d/2);
            houseGroup.add(wall1);

            let wall2 = new THREE.Mesh(new THREE.BoxGeometry(w, h, 10), houseMat);
            wall2.position.set(0, h/2, d/2);
            houseGroup.add(wall2);

            let wall3 = new THREE.Mesh(new THREE.BoxGeometry(10, h, d), houseMat);
            wall3.position.set(-w/2, h/2, 0);
            houseGroup.add(wall3);

            // السقف
            let roof = new THREE.Mesh(new THREE.BoxGeometry(w + 20, 10, d + 20), new THREE.MeshLambertMaterial({ color: 0xb91c1c }));
            roof.position.set(0, h + 5, 0);
            houseGroup.add(roof);

            houseGroup.position.set(hx, 0, hz);
            scene.add(houseGroup);

            // تسجيل علبة الاصطدام
            obstacleBoxes.push(new THREE.Box3().setFromObject(houseGroup));
        }

        // صناديق وعوائق
        for (let i = 0; i < 40; i++) {
            let bx = 300 + Math.random() * 4400;
            let bz = 300 + Math.random() * 4400;
            let box = new THREE.Mesh(new THREE.BoxGeometry(30, 30, 30), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
            box.position.set(bx, 15, bz);
            scene.add(box);
            obstacleBoxes.push(new THREE.Box3().setFromObject(box));
        }
    }

    function checkCollisions(newX, newZ) {
        let playerBox = new THREE.Box3(
            new THREE.Vector3(newX - 10, myPos.y - 15, newZ - 10),
            new THREE.Vector3(newX + 10, myPos.y + 15, newZ + 10)
        );

        for (let box of obstacleBoxes) {
            if (playerBox.intersectsBox(box)) return true; // يوجد اصطدام!
        }
        return false;
    }

    function buildWeapons() {
        muzzleFlashLight = new THREE.PointLight(0xffaa00, 0, 40);
        muzzleFlashLight.position.set(0, 0, -2.2);
        fpWeaponGroup.add(muzzleFlashLight);

        knifeMesh = new THREE.Group();
        let blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.12, 0.6), new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8 }));
        let handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.25), new THREE.MeshLambertMaterial({ color: 0x059669 }));
        handle.rotation.x = Math.PI / 2; handle.position.z = 0.35;
        knifeMesh.add(blade); knifeMesh.add(handle);
        knifeMesh.position.set(0.25, -0.25, -0.5);
        fpWeaponGroup.add(knifeMesh);

        pistolMesh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.7), new THREE.MeshLambertMaterial({ color: 0xd4af37 }));
        pistolMesh.position.set(0.25, -0.25, -0.5);
        pistolMesh.visible = false;
        fpWeaponGroup.add(pistolMesh);

        rifleMesh = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, 1.8), new THREE.MeshLambertMaterial({ color: 0x4d7c0f }));
        rifleMesh.position.set(0.2, -0.2, -0.6);
        rifleMesh.visible = false;
        fpWeaponGroup.add(rifleMesh);
    }

    function performAttack() {
        const weapon = WEAPONS[currentWeaponId];
        if (weapon.isMelee) {
            if (!isKnifeSwinging) {
                isKnifeSwinging = true;
                knifeAttackType = (knifeAttackType + 1) % 3;
                knifeAnimTime = 0;
            }
            return;
        }

        if (weapon.currentAmmo <= 0 || isReloading) return;
        weapon.currentAmmo--;
        updateAmmoUI();

        muzzleFlashLight.intensity = 3;
        setTimeout(() => muzzleFlashLight.intensity = 0, 50);
        playerPitch += (currentWeaponId === 3 ? 0.03 : 0.015);
    }

    function triggerReload() {
        const w = WEAPONS[currentWeaponId];
        if (w.isMelee || w.currentAmmo === w.maxAmmo || isReloading) return;
        isReloading = true;
        reloadAnimTime = 0;
        setTimeout(() => {
            let needed = w.maxAmmo - w.currentAmmo;
            let amt = Math.min(needed, w.reserveAmmo);
            w.currentAmmo += amt;
            w.reserveAmmo -= amt;
            updateAmmoUI();
            isReloading = false;
        }, 1200);
    }

    function takeDamage(amount) {
        hp -= amount;
        if (hp < 0) hp = 0;
        document.getElementById('hpBarFill').style.width = hp + '%';
        document.getElementById('hpValue').innerText = hp;

        const vig = document.getElementById('damageVignette');
        vig.style.opacity = '1';
        setTimeout(() => vig.style.opacity = '0', 300);

        if (hp <= 0) {
            deaths++;
            showNotification("💀 لقد مت!");
            myPos = { x: 2500, y: 35, z: 2500 };
            hp = 100;
            document.getElementById('hpBarFill').style.width = '100%';
        }
    }

    function toggleADS(state) {
        if (currentWeaponId === 1) return;
        isAiming = state;
        document.getElementById('scopeOverlay').style.display = isAiming ? 'block' : 'none';
        fpWeaponGroup.visible = !isAiming && !isThirdPerson;
        camera.fov = isAiming ? 20 : 75;
        camera.updateProjectionMatrix();
    }

    function selectWeapon(id) {
        currentWeaponId = id;
        toggleADS(false);
        document.querySelectorAll('.slot').forEach((s, idx) => s.classList.toggle('active', idx + 1 === id));
        document.getElementById('currentWeaponText').innerText = WEAPONS[id].name;

        knifeMesh.visible = (id === 1);
        pistolMesh.visible = (id === 2);
        rifleMesh.visible = (id === 3);
        updateAmmoUI();
    }

    function updateAmmoUI() {
        const w = WEAPONS[currentWeaponId];
        document.getElementById('ammoCount').innerText = w.isMelee ? "∞ / ∞" : `${w.currentAmmo} / ${w.reserveAmmo}`;
    }

    function toggleLeaderboard(show) {
        const lb = document.getElementById('leaderboard');
        lb.style.display = show ? 'block' : 'none';
        if (show) {
            let content = `<div class="lb-row"><b>اللاعب</b><b>القتلات</b><b>الموتات</b></div>`;
            content += `<div class="lb-row"><span>${playerName} (أنت)</span><span>${kills}</span><span>${deaths}</span></div>`;
            for (let id in otherPlayers) {
                content += `<div class="lb-row"><span>${otherPlayers[id].name}</span><span>${otherPlayers[id].kills}</span><span>${otherPlayers[id].deaths}</span></div>`;
            }
            document.getElementById('lbContent').innerHTML = content;
        }
    }

    function togglePerspective() {
        isThirdPerson = !isThirdPerson;
        fpWeaponGroup.visible = !isThirdPerson;
    }

    function endGame() {
        alert(`🏆 انتهت اللعبة!\nقتلاتك: ${kills}`);
        location.reload();
    }

    function animate() {
        requestAnimationFrame(animate);

        let inputX = 0, inputZ = 0;
        if (keys.w) inputZ += 1;
        if (keys.s) inputZ -= 1;
        if (keys.a) inputX -= 1;
        if (keys.d) inputX += 1;

        let speed = keys.shift ? baseMoveSpeed * 1.7 : baseMoveSpeed;

        // ميكانيكية التزحلق (Slide)
        if (isSliding) {
            slideTimer += 0.05;
            speed = baseMoveSpeed * 2.8;
            camera.position.y = myPos.y - 12; // انخفاض الكاميرا
            if (slideTimer >= 1.0) isSliding = false;
        }

        if (inputX !== 0 || inputZ !== 0) {
            let sin = Math.sin(playerYaw), cos = Math.cos(playerYaw);
            let nextX = myPos.x + (inputX * cos - inputZ * sin) * speed;
            let nextZ = myPos.z + (-inputX * sin - inputZ * cos) * speed;

            // فحص الفيزياء ومنع اختراق الجدران
            if (!checkCollisions(nextX, myPos.z)) myPos.x = nextX;
            if (!checkCollisions(myPos.x, nextZ)) myPos.z = nextZ;
        }

        velocityY += gravity;
        myPos.y += velocityY;

        if (myPos.y <= 35) {
            myPos.y = 35;
            velocityY = 0;
            isGrounded = true;
        }

        let distFromCenter = Math.sqrt(Math.pow(myPos.x - zoneCenter.x, 2) + Math.pow(myPos.z - zoneCenter.z, 2));
        if (distFromCenter > zoneRadius) takeDamage(1.5);

        if (isKnifeSwinging) {
            knifeAnimTime += 0.15;
            if (knifeAttackType === 0) knifeMesh.rotation.y = Math.sin(knifeAnimTime) * 1.2;
            else if (knifeAttackType === 1) knifeMesh.rotation.x = Math.sin(knifeAnimTime) * 1.2;
            else knifeMesh.position.z = -0.5 - Math.sin(knifeAnimTime) * 0.3;

            if (knifeAnimTime >= Math.PI) {
                isKnifeSwinging = false;
                knifeMesh.rotation.set(0, 0, 0);
                knifeMesh.position.set(0.25, -0.25, -0.5);
            }
        }

        thirdPersonMesh.position.set(myPos.x, myPos.y - 15, myPos.z);
        thirdPersonMesh.rotation.y = playerYaw;
        thirdPersonMesh.visible = isThirdPerson;

        if (!isSliding) camera.position.y = myPos.y;
        if (isThirdPerson) {
            camera.position.set(myPos.x + Math.sin(playerYaw) * 90, myPos.y + 35, myPos.z + Math.cos(playerYaw) * 90);
        } else {
            camera.position.x = myPos.x;
            camera.position.z = myPos.z;
        }

        camera.rotation.y = playerYaw;
        camera.rotation.x = playerPitch;

        renderer.render(scene, camera);
    }
</script>

</html>
